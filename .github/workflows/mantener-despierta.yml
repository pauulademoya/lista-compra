name: Mantener despierta la app

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visitar la app y despertarla si hace falta
        run: python scripts/mantener_despierta.py
